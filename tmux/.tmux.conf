bind-key x kill-pane
bind-key X kill-window

bind-key K display-popup -E "\
  tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
   fzf --reverse -m --header=kill-session |\
   xargs -I {} tmux kill-session -t {}"

# lazy-tmux. C-s: save all, P: picker/restore
# bind-key C-s run-shell 'lazy-tmux save --all && tmux display-message "lazy-tmux: all sessions saved"'
bind-key s display-popup -B -E 'lazy-tmux picker'

# Periodic autosave daemon — saves all sessions on the save_interval set in
# ~/.config/lazy-tmux/lazy-tmux.toml (3m), scrollback included. Idempotent: guarded against
# duplicates so `prefix + R` config reloads won't spawn extra daemons.
run-shell -b 'pgrep -f "lazy-tmux daemon" >/dev/null 2>&1 || (lazy-tmux daemon >/dev/null 2>&1 &)'

#Easy config reload
bind-key R source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded."

#Start window numbering at 1
set -g allow-rename off    # stop renaming windows automatically
set -g base-index 1        # start window numbering at 1
set -g pane-base-index 1   # keep pane numbering consistent with windows
set -g renumber-windows on # renumber windows when window closed

set -g status-justify left
set -g status-left-length 40
set -g status-left "#S "
