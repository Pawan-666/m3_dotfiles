# set -g status-right '#[fg=colour244] #S #[fg=colour244]#P/#{window_panes} #[fg=colour244] %a %b %d, %Y-%m-%d %I:%M'
# set -g status-right '#[fg=colour244] %a %b %d
# Pane map: a 2x2 mini-screen (quarters map to window regions). The region your
# active pane occupies is filled magenta; every region occupied by another pane
# is a near-background grey slot. A lone pane shows NOTHING (the common case
# stays clean). Each column is one half-block glyph
# (fg = top quarter, bg = bottom quarter) so both rows fit in one status line.
#
# The map lives in the per-window option @panemap, computed by
# scripts/tmux-pane-map.sh and shown via #{@panemap} in status-left above. It
# is a script (not pure tmux format) on purpose: it derives coverage from the
# NON-active panes, whose geometry keeps its real coordinates even when a pane
# is ZOOMED — so the split view stays correct under zoom (a zoomed pane's own
# #{pane_left}/#{pane_right} collapse to full-window and would blank the map).
# The hooks below recompute @panemap on every pane/layout/zoom/window change;
# the run-shell primes it for all existing windows at load/reload.
# set -g status-right '#[fg=colour244] #S #[fg=colour244]#P/#{window_panes} #[fg=colour244]  %Y-%m(%b)-%d(%a) %I:%M'
set -g status-right '%Y-%m(%b)-%d(%a) %I:%M'
# window-layout-changed already fires on split, kill, exit, resize and zoom,
# and session-window-changed on new/selected windows, so these four cover it.
set-hook -g after-select-pane      'run-shell -b "~/mac_dotfiles/scripts/tmux-pane-map.sh #{window_id}"'
set-hook -g window-layout-changed  'run-shell -b "~/mac_dotfiles/scripts/tmux-pane-map.sh #{window_id}"'
set-hook -g session-window-changed 'run-shell -b "~/mac_dotfiles/scripts/tmux-pane-map.sh #{window_id}"'
set-hook -g client-session-changed 'run-shell -b "~/mac_dotfiles/scripts/tmux-pane-map.sh #{window_id}"'
run-shell -b 'for w in $(tmux list-windows -a -F "#{window_id}"); do ~/mac_dotfiles/scripts/tmux-pane-map.sh "$w"; done'
# set -g status-right '#[fg=cyan]%a %b %d, %Y - %H:%M:%S'
set -g status-style fg=colour244,bg=default
set-window-option -g window-status-current-style fg=brightwhite,bg=default

# AI coding-agent status (Claude Code / Cursor) — colored dot per window,
# set by ~/mac_dotfiles/scripts/agent-tmux-status.sh via agent lifecycle hooks.
set -g window-status-format         '#{@ai_status}#I:#W#F'
set -g window-status-current-format '#I:#{@ai_status}#W#{@panemap}'

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'


